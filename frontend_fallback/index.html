<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nirikshan — complaints as sensors</title>
<!--
  The whole interface: plain HTML/CSS/JS, no npm, no CDN, no build step.
  backend/app.py serves this directory at "/" (it prefers frontend/dist if that exists).
  Structure follows docs/FRONTEND_SPEC.md: pages in §5, the map in §6, the demo in §10.
  Scripts are classic globals in dependency order, all hanging off window.NIRI.
-->
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 19c3-6 7-8 14-8-4 3-5 6-5 9" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Nirikshan</h1>
        <p class="tagline">Complaints as sensors</p>
      </div>
    </div>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="side-foot">
      <p id="ai-mode" class="ai-badge" title="which provider wrote the drafts">AI: …</p>
      <p id="clock" class="clock"
         title="demo clock — every timestamp in this app is in this frame">…</p>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div>
        <h2 id="page-title">Dashboard</h2>
        <p id="page-sub" class="muted"></p>
      </div>
      <div class="topbar-right">
        <span id="request-id" class="reqid" title="X-Request-Id of the last call"></span>
      </div>
    </header>

    <div id="banner" class="banner" role="note">
      <strong id="banner-strong">Automated findings support human judgment.</strong>
      <span id="banner-text">They are not official regulatory decisions.</span>
      <span id="banner-data" class="pill">synthetic sample data</span>
    </div>

    <div id="view" class="view" tabindex="-1"></div>

    <footer id="foot">
      <span id="foot-disclaimer"></span>
      <span class="dot">·</span>
      <span id="foot-data"></span>
      <span class="dot">·</span>
      <span id="foot-counts" class="mono"></span>
      <span class="dot">·</span>
      <a href="/docs">API docs</a>
      <span class="dot">·</span>
      <a href="/openapi.json">openapi.json</a>
    </footer>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<div id="panel" class="panel-host" hidden>
  <section class="panel" role="dialog" aria-labelledby="panel-title">
    <header>
      <h3 id="panel-title">Node</h3>
      <div class="panel-head-right">
        <a id="panel-full" class="link" href="#">Open node detail</a>
        <button id="panel-close" class="ghost" aria-label="Close panel">Close</button>
      </div>
    </header>
    <div id="panel-body"></div>
  </section>
</div>

<script src="api.js"></script>
<script src="components.js"></script>
<script src="map.js"></script>
<script src="pages_core.js"></script>
<script src="pages_domains.js"></script>
<script src="app.js"></script>
</body>
</html>
